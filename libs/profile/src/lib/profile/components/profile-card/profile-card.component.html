<div class="profile" [tuiSkeleton]="(followingsLoading$ | async)!">
    <tui-avatar
        size="xxl"
        [src]="user.profilePictureId"
        (click)="openProfile()"
    />
    <div class="profile__info">
        <h3 class="profile__name">
            {{user.firstName}} {{user.secondName}}
        </h3>
        <button
            iconEnd="@tui.message-circle"
            tuiLink
            type="button"
        >
            Написать сообщение
        </button>
    </div>
    @if ((currentUser$ | async)?.uid !== user.uid) {
        <button
            *tuiLet="isFollowing$ | async as isFollowing"
            tuiButton
            size="s"
            type="button"
            class="profile__follow"
            [style.background-color]="isFollowing ? 'red' : '#526ed3'"
            (click)="toggleFollow()"
        >
            {{ isFollowing ? 'Отписаться' : 'Подписаться'}}
        </button>
    }
</div>
