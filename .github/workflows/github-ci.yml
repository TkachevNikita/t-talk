name: CI/CD

on:
    push:
        branches:
            - staging

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              with:
                lfs: true
            - name: Setup Node
              uses: actions/setup-node@v2
              with:
                  node-version: '20.11'

            - name: Install dependencies
              run: npm install

            - name: Create environment file
              run: |
                echo "export const environment = {" > environments/environment.ts
                echo "  apiKey: '$FIREBASE_API_KEY'," >> environments/environment.ts
                echo "  authDomain: '$FIREBASE_AUTH_DOMAIN'," >> environments/environment.ts
                echo "  projectId: '$FIREBASE_PROJECT_ID'," >> environments/environment.ts
                echo "  storageBucket: '$FIREBASE_STORAGE_BUCKET'," >> environments/environment.ts
                echo "  messagingSenderId: '$FIREBASE_MESSAGING_SENDER_ID'," >> environments/environment.ts
                echo "  appId: '$FIREBASE_APP_ID'," >> environments/environment.ts
                echo "  measurementId: '$FIREBASE_MEASUREMENT_ID'," >> environments/environment.ts
                echo "  sentryDsn: '$SENTRY_DSN'" >> environments/environment.ts
                echo "};" >> environments/environment.ts

            - name: Build project
              run: |
                npm run build
                mv dist/t-talk/browser/* dist/

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4.5.0
              with:
                  branch: gh-pages
                  folder: dist
