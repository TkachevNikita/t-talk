<h2>
    Редактирование профиля
</h2>
<div class="profile" *tuiLet="user$ | async as user">
    <form [formGroup]="profileForm" class="profile__form">
        <tui-avatar
            [style.align-self]="'center'"
            size="xxl"
            [src]="newPicture || user?.profilePictureId"
        />
        <label tuiInputFiles>
            <input
                tuiInputFiles
                formControlName="avatar"
            />
            <ng-template let-dragged>
                <div
                    *ngIf="dragged; else base"
                    class="content"
                >
                    <tui-avatar
                        appearance="secondary"
                        src="@tui.droplet"
                    />
                </div>
                <ng-template #base>
                    <div class="content">
                        <tui-avatar
                                appearance="secondary"
                                src="@tui.cloud-upload"
                        />
                        <div>
                            Перетащите изображение сюда или
                            <a tuiLink>нажмите для загрузки</a>
                        </div>
                    </div>
                </ng-template>
            </ng-template>
        </label>
        <div class="profile__form--group">
            <label class="profile__form--gender" tuiBlock>
                <input
                    formControlName="gender"
                    size="m"
                    tuiRadio
                    type="radio"
                    [value]="0"
                />
                Мужской
            </label>
            <label class="profile__form--gender" tuiBlock>
                <input
                    formControlName="gender"
                    size="m"
                    tuiRadio
                    type="radio"
                    [value]="1"
                />
                Женский
            </label>
        </div>

        <div class="profile__form--control">
            <tui-input
                formControlName="firstName"
                tuiTextfieldSize="m"
                [tuiTextfieldCleaner]="true"
                style="width: 100%"
            >
                Введите имя
            </tui-input>
            <tui-error [error]="computeError('firstName')"/>
        </div>
        <div class="profile__form--control">
            <tui-input
                formControlName="secondName"
                tuiTextfieldSize="m"
                [tuiTextfieldCleaner]="true"
                style="width: 100%"
            >
                Введите фамилию
            </tui-input>
            <tui-error [error]="computeError('secondName')"/>
        </div>
        <div class="profile__form--control">
            <tui-input-date
                formControlName="birthDate"
                tuiTextfieldSize="s"
            >
                Выберите дату рождения
            </tui-input-date>
            <tui-error [error]="computeError('birthDate')"/>
        </div>
        <div class="profile__form--control">
            <tui-textarea formControlName="bio">
                О себе
            </tui-textarea>
            <tui-error [error]="computeError('bio')"/>
        </div>
        <button tuiButton type="button" (click)="updateUser()" [disabled]="isLoading$ | async">
            Сохранить
        </button>
    </form>
</div>
