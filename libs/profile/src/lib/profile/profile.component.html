<ng-container *tuiLet="user$ | async as user">
    <header tuiNavigationHeader>
    <span tuiNavigationLogo>
        <img src="logo.png" [style.width]="'30px'" alt="logo"/>
        <span tuiFade>T-Talk</span>
    </span>
        <hr />
        <button
            iconStart="@tui.bell"
            tuiIconButton
            type="button"
        >
            Notifications
            <tui-badge-notification />
        </button>
        @if (user) {
            <tui-avatar
                [tuiDropdown]="more"
                tuiDropdownOpen
                [src]="user.firstName[0] + user.secondName[0]"
                [style.cursor]="'pointer'"
            />
            <ng-template
                #more
                let-close
            >
                <tui-data-list tuiDataListDropdownManager>
                    <button
                        tuiOption
                        type="button"
                        size="xs"
                        (click)="logout()"
                    >
                        Выйти
                    </button>
                </tui-data-list>
            </ng-template>
        }
    </header>
    <div [style.display]="'flex'" [style.height]="'100%'">
        <aside
            [tuiNavigationAside]="expanded"
        >
            <header>
                <button
                    iconStart="@tui.home"
                    tuiAsideItem
                    type="button"
                    [routerLink]="'/profile/' + user?.uid"
                >
                    <span tuiFade >
                        Моя страница
                    </span>
                </button>
            </header>
            <button
                iconStart="@tui.search"
                tuiAsideItem
                type="button"
                routerLink="/profile/search"
            >
                Поиск
            </button>
            <button
                automation-id="hint"
                iconStart="@tui.message-circle"
                tuiAsideItem
                type="button"
            >
                <span tuiFade>Мои сообщения</span>
            </button>
            <footer>
                <button
                    class="aside-btn"
                    tuiAsideItem
                    type="button"
                    [iconStart]="expanded ? '@tui.chevron-left' : '@tui.chevron-right'"
                    (click)="expanded = !expanded"
                >
                    {{ expanded ? 'Скрыть' : 'Раскрыть' }}
                </button>
            </footer>
        </aside>
        <main tuiNavigationMain class="main">
            <router-outlet/>
        </main>
    </div>
</ng-container>
