<div class="profile">
    <tui-avatar
        size="xxl"
        [src]="user.profilePictureId"
        (click)="openProfile()"
    />
    <div class="profile__info">
        <h3 class="profile__name">
            {{user.firstName}} {{user.secondName}}
        </h3>
        <button
            iconEnd="@tui.message-circle"
            tuiLink
            type="button"
        >
            Написать сообщение
        </button>
    </div>
    @if ((currentUser$ | async)?.uid !== user.uid) {
        <button
            tuiButton
            size="s"
            type="button"
            [style.margin-left]="'auto'"
            (click)="toggleFollow()"
        >
            {{ (isFollowing$ | async) ? 'Отписаться' : 'Подписаться'}}
        </button>
    }
</div>
